name: Windows graphics diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphics:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --no-shell chromium
      - run: node scripts/diagnose-graphics.mjs
