name: npm packages and standalone distribution
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:release
      - run: npm -w @velocut/cli test
      - run: npm run pack:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:distribution
      - uses: actions/upload-artifact@v4
        with:
          name: velocut-distribution-${{ matrix.os }}
          path: artifacts/
          include-hidden-files: true
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: velocut-distribution-ubuntu-latest
          path: artifacts
      - name: Verify tag and archive portable app / plugin marketplace
        run: |
          node -e "const m=require('./artifacts/manifest.json'); if('v'+m.version!==process.env.GITHUB_REF_NAME)throw Error('tag/package version mismatch')"
          tar -czf artifacts/velocut-standalone.tar.gz -C artifacts "velocut-${GITHUB_REF_NAME#v}"
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.tgz artifacts/velocut-standalone.tar.gz artifacts/manifest.json --repo "$GITHUB_REPOSITORY" --draft --generate-notes
